<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="メモ帖">
<meta name="theme-color" content="#2f5d50">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache">
<title>メモ・スケジュール帖</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#222;--sub:#6b6b6b;--line:#e2e0d9;--acc:#2f5d50;--acc2:#e6efeb;--red:#c0392b;--blue:#2c5aa0;--warn:#b7791f;--shadow:0 1px 2px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#161817;--card:#212423;--ink:#e8e8e6;--sub:#9a9d9b;--line:#363b39;--acc:#7fbfa8;--acc2:#25332e;--red:#e57368;--blue:#86aae6;--warn:#e0b25a;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Meiryo","メイリオ","MS Gothic","ＭＳ ゴシック","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--acc);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;display:flex;align-items:center;gap:10px}
@media (prefers-color-scheme:dark){header{background:#1f3a32}}
header h1{font-size:17px;margin:0;flex:1;font-weight:700;letter-spacing:.02em}
#st{font-size:12px;opacity:.95;white-space:nowrap}
#syncBtn{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:12px 14px calc(84px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:12px;color:var(--sub);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button b{font-size:19px;font-weight:400;line-height:1.2}
nav button.on{color:var(--acc);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=search],input[type=password],input[type=date],input[type=time],select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:16px}
textarea{resize:vertical;min-height:70px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){.btn.p{color:#10201b}}
.btn.s{padding:4px 9px;font-size:13px}
.btn.d{color:var(--red)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:700}
.muted{color:var(--sub);font-size:13px}
.memo-t{white-space:pre-wrap;word-break:break-word}
.memo-t a{color:var(--blue)}
.tag{color:var(--acc);font-weight:700}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pin{border-left:4px solid var(--warn)}
#mIn{min-height:84px;overflow-y:auto;resize:none;line-height:1.55}
#mIn::placeholder{white-space:pre-line}
.ml{padding:10px 12px;cursor:pointer}
.ml .mh{display:flex;gap:8px;align-items:baseline}
.ml .mt{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ml .md{font-size:12px;color:var(--sub);white-space:nowrap}
.ml .mp{font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ml.open{cursor:default}
.ml.open .mt{white-space:normal}
.ml .mbody{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.ml .mti{font-weight:700;font-size:16px;border:1px solid transparent;background:var(--acc2);margin-top:6px}
.ml .mbi{border:1px solid transparent;background:var(--acc2);margin-top:6px;min-height:60px;resize:none;overflow-y:auto;line-height:1.55}
.ml .mti:focus,.ml .mbi:focus{border-color:var(--acc);background:var(--card);outline:none}
.ml .mcl{font-size:13px;color:var(--acc);border:1px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--card);cursor:pointer;white-space:nowrap}
.ml .msv{font-size:12px;color:var(--sub);margin-left:auto}
.ml .mlk{font-size:13px;margin-top:4px;word-break:break-all}
.ml .mlk a{color:var(--blue)}
#eT{min-height:45vh;resize:vertical;line-height:1.55}
h2{font-size:16px;margin:16px 0 8px}
/* calendar */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.calhead .ttl{flex:1;text-align:center;font-weight:700;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dow{text-align:center;font-size:12px;color:var(--sub);padding:2px 0}
.day{background:var(--card);border:1px solid var(--line);border-radius:7px;min-height:66px;padding:2px 3px;cursor:pointer;overflow:hidden;position:relative}
.day.out{opacity:.38}
.day.sel{outline:2px solid var(--acc);outline-offset:-1px}
.day.today .dn{background:var(--acc);color:#fff;border-radius:999px;padding:0 5px}
.dn{font-size:12px;font-weight:700;display:inline-block}
.sun .dn,.hol .dn{color:var(--red)}.sat .dn{color:var(--blue)}
.day.today.sun .dn,.day.today.hol .dn,.day.today.sat .dn{color:#fff}
.ev{font-size:10.5px;line-height:1.35;border-radius:3px;padding:0 3px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.more{font-size:10px;color:var(--sub)}
.hn{font-size:9.5px;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.tdc{position:absolute;right:3px;top:2px;font-size:10px;color:var(--acc);font-weight:700}
.item{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.item .tm{font-size:13px;color:var(--sub);min-width:84px}
.item input[type=checkbox]{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--acc)}
.done-t{text-decoration:line-through;color:var(--sub)}
.over{color:var(--red);font-weight:700}
.link{color:var(--blue);cursor:pointer;font-size:13px}
/* modal */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;display:none;align-items:flex-end;justify-content:center}
#ov.on{display:flex}
#md{background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:700px){#ov{align-items:center}#md{border-radius:16px}}
#md label{display:block;font-size:13px;color:var(--sub);margin:10px 0 3px}
#md h3{margin:2px 0 6px;font-size:17px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
/* kakunin */
.kk h1{font-size:17px;margin:4px 0 8px}
.kk h2{font-size:16px;border-left:4px solid var(--acc);padding-left:8px;margin:20px 0 8px}
.kk h3{font-size:15px;margin:14px 0 6px}
.kk ul{padding-left:20px;margin:6px 0}
.kk li{margin:3px 0}
.kk code{background:var(--acc2);border-radius:4px;padding:0 4px;font-size:.9em;word-break:break-all}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px 0 10px}
.kk table{border-collapse:collapse;width:100%;font-size:14px;background:var(--card)}
.kk th,.kk td{border:1px solid var(--line);padding:6px 7px;vertical-align:top;text-align:left}
.kk th{background:var(--acc2);white-space:nowrap}
.kk td.ck{width:34px;text-align:center}
.kk tr.dn td:not(.ck),.kk li.dn .lt{text-decoration:line-through;color:var(--sub)}
.kk li.cb{list-style:none;margin-left:-20px;display:flex;gap:8px;align-items:flex-start}
.kk input[type=checkbox]{width:19px;height:19px;accent-color:var(--acc)}
.kk mark{background:#ffe58a;color:#222}
.kk .cmb{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:1px 5px;font-size:13px;cursor:pointer;margin-top:4px;line-height:1.4}
.kk .cmb.has{background:var(--acc2);border-color:var(--acc)}
.kk .cmt{font-size:13px;background:var(--acc2);border-radius:7px;padding:4px 8px;margin-top:4px;white-space:pre-wrap;color:var(--ink);cursor:pointer}
.kk tr.cm td{border-top:0;padding-top:0}
.kk li .cmt{margin-left:0}
details.log summary{cursor:pointer;font-weight:700}
.kk details.pre{border:1px solid var(--line);border-radius:9px;padding:6px 10px;margin:4px 0 12px}
.kk details.pre summary{cursor:pointer;font-weight:700;font-size:14px}
.kk details.pre[open] summary{margin-bottom:6px}
@media (max-width:640px){
 .kk table,.kk tbody,.kk tr,.kk td{display:block;width:auto}
 .kk table{background:none}
 .kk tr:first-child{display:none}
 .kk tr{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 8px 6px 46px;margin:0 0 8px;position:relative}
 .kk tr.cm{border:0;background:none;padding:0 0 0 46px;margin:-6px 0 10px}
 .kk td{border:0;padding:1px 0}
 .kk td.ck{position:absolute;left:8px;top:8px;width:auto;padding:0}
 .kk td[data-l]:not(:last-child){display:inline-block;margin-right:10px;font-size:13px;color:var(--sub)}
 .kk td[data-l]::before{content:attr(data-l)"：";font-size:12px;color:var(--sub)}
 .kk td:last-child::before{display:block}
 .kk tr.cm td:first-child{display:none}
 .tw{overflow:visible}
}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:9px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:.95}
.hide{display:none!important}
#bn{max-width:860px;margin:0 auto;padding:0 14px}
#bn .w{margin-top:10px;border-radius:10px;padding:9px 12px;font-size:14px;background:#fff4d6;color:#5a4300;border:1px solid #e8c766;cursor:pointer}
#bn .w.x{background:#fde2df;color:#7a1d12;border-color:#e59a90}
.help{font-size:14px}
.help ol{padding-left:20px}
.help code{background:var(--acc2);padding:0 4px;border-radius:4px;word-break:break-all}
.pr label{display:block;font-size:13px;color:var(--sub);margin:12px 0 3px;font-weight:700}
.rq{color:var(--red)}
.pv{font-size:11px;font-weight:400;border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:4px}
.ph-h{font-size:12px;color:var(--sub);margin-top:3px}
.pc{margin:2px 0}
.pscn{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.pscn .btn{text-align:left;white-space:normal;padding:7px 8px;font-size:13.5px;line-height:1.35}
.pfd summary{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--card);font-size:14px}
.pout{white-space:pre-wrap;word-break:break-word;background:var(--acc2);border-radius:9px;padding:10px;font-size:13px;max-height:340px;overflow:auto;margin:8px 0 4px;font-family:inherit}
.pw{border-radius:9px;padding:7px 10px;font-size:13px;margin:6px 0;background:#fff4d6;color:#5a4300;border:1px solid #e8c766}
.pw.x{background:#fde2df;color:#7a1d12;border-color:#e59a90}
.pw.ok{background:var(--acc2);color:var(--acc);border-color:var(--acc)}
.pbar{position:sticky;bottom:calc(62px + env(safe-area-inset-bottom));z-index:15;display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 10px;box-shadow:0 2px 8px rgba(0,0,0,.12);margin:4px 0 10px}
#pr{display:none}
@media print{
 @page{size:A4 landscape;margin:8mm}
 html,body{background:#fff!important;color:#000!important}
 body>*:not(#pr){display:none!important}
 #pr{display:block;font-family:"Meiryo","メイリオ","MS Gothic","ＭＳ ゴシック",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;color:#000}
 .pm{break-after:page;page-break-after:always}
 .pm:last-child{break-after:auto;page-break-after:auto}
 .ph{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 2mm}
 .ph b{font-size:15pt}.ph span{font-size:8pt;color:#555}
 table.pg{width:100%;border-collapse:collapse;table-layout:fixed}
 .pg th{font-size:9pt;border:.3mm solid #888;padding:.5mm;background:#eee}
 .pg td{border:.3mm solid #888;vertical-align:top;padding:0}
 .pc{overflow:hidden;padding:.6mm 1mm}
 .pg td.ot{background:#f3f3f3}.pg td.ot b{color:#aaa}
 .pd b{font-size:10pt}.pd span{font-size:7pt;color:#c00;margin-left:1.5mm}
 .su .pd b,th.su{color:#c00}.sa .pd b,th.sa{color:#1a4fa0}
 .pe{font-size:7.5pt;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .pe i{display:inline-block;width:1.4mm;height:2.6mm;margin-right:.8mm;vertical-align:-.3mm}
 .pt{font-weight:700;margin-right:.8mm}
 .pl table{width:100%;border-collapse:collapse;font-size:9pt}
 .pl th,.pl td{border:.3mm solid #888;padding:1mm 1.5mm;vertical-align:top;text-align:left}
 .pl th{background:#eee}.pl tr{break-inside:avoid}
}
</style>

<body>
<header>
  <h1>メモ・スケジュール帖</h1>
  <span id="st">…</span>
  <button id="syncBtn" title="今すぐ同期">⟳</button>
</header>
<div id="bn"></div>
<main id="main"></main>
<nav id="nav">
  <button data-t="memo"><b>✎</b>メモ</button>
  <button data-t="cal"><b>▦</b>予定</button>
  <button data-t="todo"><b>☑</b>TODO</button>
  <button data-t="kk"><b>≡</b>確認・進捗</button>
  <button data-t="pr"><b>✦</b>依頼文</button>
  <button data-t="set"><b>⚙</b>設定</button>
</nav>
<div id="ov"><div id="md"></div></div>
<div class="toast" id="toast"></div>
<div id="pr"></div>

<script>
'use strict';
/* ===== 基本 ===== */
const LS={data:'msb.data',cfg:'msb.cfg',kk:'msb.kk',kk2:'msb.kk2',ui:'msb.ui'};
const CATS=[['work','仕事','#2c5aa0'],['study','学会・研究','#7b4fa0'],['home','家庭','#c0392b'],['me','個人','#2f8f5b'],['etc','その他','#7a7a7a']];
const CATMAP=Object.fromEntries(CATS.map(c=>[c[0],c]));
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();
const uid=()=>now().toString(36)+Math.random().toString(36).slice(2,8);
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pYmd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=pYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const WD='日月火水木金土';
const jDate=s=>{if(!s)return'';const d=pYmd(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'};
const fmtTs=t=>{const d=new Date(t);return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}

const emptyDB=()=>({v:1,memos:[],events:[],todos:[],kkChecks:{},kkLog:[],kkMeta:null,kkMeta2:null,pTpl:[]});
let db=Object.assign(emptyDB(),lsGet(LS.data)||{});
let cfg=Object.assign({owner:'',repo:'',token:'',weekStart:0,tokenExp:''},lsGet(LS.cfg)||{});
let ui=Object.assign({tab:'memo',memoTag:'',todoF:'open',calView:'month'},lsGet(LS.ui)||{});
let kkText=lsGet(LS.kk)||'';
let kkText2=lsGet(LS.kk2)||''; // 進捗（参照のみ）
let pending=!!(lsGet('msb.pending'));
const S={month:null,sel:today(),q:'',kq:'',kd:'kakunin'};
{const d=new Date();S.month=new Date(d.getFullYear(),d.getMonth(),1)}

const live=a=>a.filter(x=>!x.deleted);
function saveLocal(){lsSet(LS.data,db)}
function touch(o){o.updatedAt=now();return o}
function commit(){saveLocal();pending=true;lsSet('msb.pending',true);render();schedulePush()}

/* ===== 祝日（内閣府の規則による計算値。春分・秋分は計算式による） ===== */
const HC={};
function holidays(y){
  if(HC[y])return HC[y];
  const m=new Map();
  const add=(mo,d,n)=>m.set(y+'-'+pad(mo)+'-'+pad(d),n);
  const nthMon=(mo,n)=>{const f=new Date(y,mo-1,1);return 1+(8-f.getDay())%7+7*(n-1)};
  const k=y-1980,q=Math.floor(k/4);
  add(1,1,'元日');add(1,nthMon(1,2),'成人の日');add(2,11,'建国記念の日');add(2,23,'天皇誕生日');
  add(3,Math.floor(20.8431+0.242194*k-q),'春分の日');add(4,29,'昭和の日');
  add(5,3,'憲法記念日');add(5,4,'みどりの日');add(5,5,'こどもの日');
  add(7,nthMon(7,3),'海の日');add(8,11,'山の日');add(9,nthMon(9,3),'敬老の日');
  add(9,Math.floor(23.2488+0.242194*k-q),'秋分の日');add(10,nthMon(10,2),'スポーツの日');
  add(11,3,'文化の日');add(11,23,'勤労感謝の日');
  const base=[...m.keys()];
  // 国民の休日（祝日に挟まれた平日）
  for(const s of base){const n=addDays(s,1),n2=addDays(s,2);
    if(!m.has(n)&&m.has(n2)&&pYmd(n).getDay()!==0)m.set(n,'国民の休日')}
  // 振替休日
  for(const s of base){if(pYmd(s).getDay()===0){let d=addDays(s,1);while(m.has(d))d=addDays(d,1);m.set(d,'振替休日')}}
  return HC[y]=m;
}
const holName=s=>holidays(+s.slice(0,4)).get(s)||'';

/* ===== GitHub 同期 ===== */
const configured=()=>cfg.owner&&cfg.repo&&cfg.token;
function b64enc(s){const b=new TextEncoder().encode(s);let bin='';for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin)}
function b64dec(s){const bin=atob(s.replace(/\s/g,''));const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder().decode(b)}
function api(path,{method='GET',body=null,raw=false}={}){
  const u='https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+path+(method==='GET'?'?t='+now():'');
  const h={'Authorization':'Bearer '+cfg.token,'Accept':raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(body)h['Content-Type']='application/json';
  return fetch(u,{method,headers:h,cache:'no-store',body:body?JSON.stringify(body):undefined});
}
function apiErr(r){
  if(r.status===401)return 'トークンが無効か期限切れです（GitHubで作り直して、設定で貼り替え）';
  if(r.status===403)return 'トークンに書き込み権限がありません（Contents: Read and write）';
  if(r.status===404)return 'リポジトリが見つかりません（名前・トークンの対象リポジトリを確認）';
  return 'GitHubエラー '+r.status;
}
async function getFile(path){
  const r=await api(path);
  if(r.status===404){
    // ファイルが無いだけか、リポジトリが無いのかを区別
    const r2=await fetch('https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo),{headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json'},cache:'no-store'});
    if(!r2.ok)throw new Error(apiErr(r2));
    return {text:null,sha:null};
  }
  if(!r.ok)throw new Error(apiErr(r));
  const j=await r.json();
  let text;
  if(j.content&&j.encoding==='base64')text=b64dec(j.content);
  else{const r3=await api(path,{raw:true});if(!r3.ok)throw new Error(apiErr(r3));text=await r3.text()}
  return {text,sha:j.sha};
}
async function putFile(path,text,sha,msg){
  const body={message:msg,content:b64enc(text)};if(sha)body.sha=sha;
  return api(path,{method:'PUT',body});
}
function mergeDB(a,b){
  const out=emptyDB();
  const lim=now()-90*864e5; // 削除から90日経った記録は掃除
  for(const k of ['memos','events','todos','kkLog','pTpl']){
    const m=new Map();
    for(const x of (b[k]||[]))m.set(x.id,x);
    for(const x of (a[k]||[])){const y=m.get(x.id);if(!y||(x.updatedAt||0)>=(y.updatedAt||0))m.set(x.id,x)}
    out[k]=[...m.values()].filter(x=>!(x.deleted&&(x.updatedAt||0)<lim)).sort((p,q)=>p.id<q.id?-1:p.id>q.id?1:0);
  }
  const ck={};const ka=a.kkChecks||{},kb=b.kkChecks||{};
  for(const key of new Set([...Object.keys(ka),...Object.keys(kb)])){const x=ka[key],y=kb[key];ck[key]=!y||(x&&x.t>=y.t)?x:y}
  out.kkChecks=Object.fromEntries(Object.keys(ck).sort().map(k=>[k,ck[k]]));
  const ma=a.kkMeta,mb=b.kkMeta;out.kkMeta=!mb||(ma&&ma.at>=mb.at)?ma||null:mb;
  const na=a.kkMeta2,nb=b.kkMeta2;out.kkMeta2=!nb||(na&&na.at>=nb.at)?na||null:nb;
  return out;
}
const canon=d=>JSON.stringify(mergeDB(d,emptyDB()));
let syncing=false,again=false,pushT=null;
function schedulePush(){clearTimeout(pushT);if(configured())pushT=setTimeout(sync,1200);else setStatus()}
async function sync(){
  if(!configured()){setStatus();return}
  if(syncing){again=true;return}
  syncing=true;setStatus('sync');
  try{
    let ok=false;
    for(let i=0;i<4&&!ok;i++){
      const f=await getFile('data.json');
      const remote=f.text?Object.assign(emptyDB(),JSON.parse(f.text)):emptyDB();
      const merged=mergeDB(db,remote);
      db=merged;saveLocal();
      if(f.text!==null&&canon(merged)===canon(remote)){ok=true;break}
      const r=await putFile('data.json',JSON.stringify(merged,null,1),f.sha,'更新 '+fmtTs(now()));
      if(r.ok){ok=true;break}
      if(r.status!==409&&r.status!==422)throw new Error(apiErr(r));
      // 他の端末が先に保存していた → 取り直してもう一度マージ
    }
    if(!ok)throw new Error('保存が競合しました。もう一度⟳を押してください');
    pending=false;lsSet('msb.pending',false);
    if(db.kkMeta&&db.kkMeta.at!==(lsGet('msb.kkAt')||0))await pullKK();
    if(db.kkMeta2&&db.kkMeta2.at!==(lsGet('msb.kkAt2')||0))await pullKK2();
    setStatus('ok');render();
  }catch(e){
    setStatus(navigator.onLine?'err':'off',e.message);
  }finally{syncing=false;if(again){again=false;sync()}}
}
async function pullKK(){
  if(!configured())return;
  try{const f=await getFile('kakunin.md');if(f.text!==null){kkText=f.text;lsSet(LS.kk,kkText);lsSet('msb.kkAt',db.kkMeta?db.kkMeta.at:0)}}catch(e){}
}
async function pullKK2(){

  try{const f=await getFile('shinchoku.md');if(f.text!==null){kkText2=f.text;lsSet(LS.kk2,kkText2);lsSet('msb.kkAt2',db.kkMeta2?db.kkMeta2.at:0)}}catch(e){}
}
let lastSync=0;
function setStatus(s,msg){
  const el=$('#st');
  if(!configured()){el.textContent='この端末のみ（未設定）';el.title='設定タブでGitHubを設定すると全端末で同期します';return}
  if(s==='ok')lastSync=now();
  const t={sync:'同期中…',ok:'✓ 同期済 '+(lastSync?fmtTs(lastSync).slice(11):''),err:'⚠ 同期エラー',off:'オフライン（未送信あり）'}[s]||(pending?'未送信あり':'✓ 同期済');
  el.textContent=t;el.title=msg||'';
  if(s==='err'&&msg)toast(msg);
}

/* ---- 版の確認（GitHub Pagesの古い写しが出ていないか） ---- */
const APP_VER='2026-10-29b';let newVer='';
async function checkVer(){
  if(!/^https?:/.test(location.protocol))return;
  try{const r=await fetch(location.pathname+'?nc='+Date.now(),{cache:'no-store'});const t=await r.text();
    const m=t.match(/const APP_VER='([^']+)'/);if(m&&m[1]!==APP_VER){newVer=m[1];rBanner()}}catch(e){}
}
function reloadNew(){location.replace(location.pathname+'?v='+Date.now()+location.hash)}
/* ---- トークン期限の警告 ---- */
function rBanner(){
  const el=$('#bn');el.innerHTML='';
  if(newVer){el.innerHTML=`<div class="w" id="bnV">🔄 新しい版（v${newVer}）があります。ここを押すと読み込み直します（いまの版：v${APP_VER}）</div>`;$('#bnV').onclick=reloadNew}
  if(!configured()||!cfg.tokenExp)return;
  const n=Math.round((pYmd(cfg.tokenExp)-pYmd(today()))/864e5);
  if(n>30)return;
  el.insertAdjacentHTML('beforeend',`<div class="w ${n<=7?'x':''}" id="bnT">${n<0?'⚠ GitHubトークンの期限（'+jDate(cfg.tokenExp)+'）が過ぎています。':'⚠ GitHubトークンの期限まであと'+n+'日（'+jDate(cfg.tokenExp)+'）。'}作り直して「設定」で貼り替えてください（手順はREADME）。</div>`);
  $('#bnT').onclick=()=>setTab('set');
}

function linkify(t){return esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/(^|\s)(#[^\s#]+)/g,'$1<span class="tag">$2</span>')}
const tagsOf=t=>[...new Set((t.match(/(?:^|\s)#([^\s#]+)/g)||[]).map(s=>s.trim().slice(1)))];
const mLines=t=>t.split('\n').map(l=>l.trim()).filter(Boolean);
const mTitle=t=>(mLines(t)[0]||'（空のメモ）').replace(/^#+\s+/,'');
const mPrev=t=>mLines(t).slice(1).join('　');
function mSplit(t){const s=t.replace(/^\s*\n/,'');const i=s.indexOf('\n');return i<0?[s,'']:[s.slice(0,i),s.slice(i+1)]}
function saveEd(id,quiet){
  const ti=document.getElementById('mt_'+id),bo=document.getElementById('mb_'+id);if(!ti||!bo)return;

  if(t===x.text){if(sv&&sv.textContent==='入力中…')sv.textContent='保存済み';return}

function hkey(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'k'+(h>>>0).toString(36)}
function inl(s,q){let h=esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  if(q){const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');h=h.replace(/(<[^>]+>)|([^<]+)/g,(m0,tag,tx)=>tag?tag:tx.replace(re,x=>'<mark>'+x+'</mark>'))}
  return h}
const isChk=k=>{const c=db.kkChecks[k];return !!(c&&c.v)};
const kGet=k=>db.kkChecks[k]||{};
const hasK=k=>{const c=db.kkChecks[k];return !!(c&&(c.v||c.c))};
function kSet(k,patch,text){db.kkChecks[k]=Object.assign({},kGet(k),patch,{t:now(),x:text});}
function cmtHtml(k){const c=kGet(k);return c.c?`<div class="cmt" data-kc="${k}">💬 ${c.cd?jDate(c.cd)+'：':''}${esc(c.c)}</div>`:''}
function cmtBtn(k){return `<br><button class="cmb ${kGet(k).c?'has':''}" data-kc="${k}" title="対処のコメント">💬</button>`}
function mdRender(src,q){
  const L=src.replace(/\r\n?/g,'\n').split('\n');let h='',i=0,inUl=false,sec='',secs=[];const keys=[];
  const closeUl=()=>{if(inUl){h+='</ul>';inUl=false}};
  const hit=t=>!q||t.toLowerCase().includes(q.toLowerCase());
  while(i<L.length){
    let l=L[i];
    if(/^\s*\|/.test(l)){
      closeUl();const rows=[];while(i<L.length&&/^\s*\|/.test(L[i])){rows.push(L[i]);i++}
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=cells(rows[0]);const body=rows.slice(1).filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r)).map(cells);
      const shown=body.filter(r=>hit(r.join(' ')+' '+(kGet(hkey(sec+'|'+r.join('｜'))).c||'')));
      if(!shown.length)continue;
      h+='<div class="tw"><table><tr><th>済</th>'+head.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr>';
      for(const r of shown){const txt=r.join('｜');const k=hkey(sec+'|'+txt);keys.push([k,(sec?'['+sec+'] ':'')+txt]);
        h+=`<tr class="${isChk(k)?'dn':''}"><td class="ck"><input type="checkbox" data-kk="${k}" ${isChk(k)?'checked':''}>${cmtBtn(k)}</td>`+r.map((c,ci)=>`<td data-l="${esc(head[ci]||'')}">`+inl(c,q)+'</td>').join('')+'</tr>';
        if(kGet(k).c)h+=`<tr class="cm"><td></td><td colspan="${r.length}">${cmtHtml(k)}</td></tr>`}
      h+='</table></div>';continue;
    }
    let mm;
    if((mm=l.match(/^(#{1,4})\s+(.*)/))){closeUl();const lv=Math.min(mm[1].length,3);if(lv===2){sec=mm[2];secs.push(sec)}
      h+=`<h${lv} ${lv===2?`id="s${secs.length}"`:''}>${inl(mm[2])}</h${lv}>`;i++;continue}
    if((mm=l.match(/^\s*[-*]\s+(.*)/))){
      const t=mm[1];i++;{const c0=t.match(/^([□■☐☑✅])\s*(.*)/);const kc=c0?kGet(hkey(sec+'|'+c0[2])).c||'':'';if(!hit(t+' '+kc))continue}
      if(!inUl){h+='<ul>';inUl=true}
      const c=t.match(/^([□■☐☑✅])\s*(.*)/);
      if(c){const done0=/[■☑✅]/.test(c[1]);const k=hkey(sec+'|'+c[2]);keys.push([k,(sec?'['+sec+'] ':'')+c[2]]);const on=done0||isChk(k);
        h+=`<li class="cb ${on?'dn':''}"><input type="checkbox" data-kk="${k}" ${on?'checked':''} ${done0?'disabled':''}><div class="grow"><span class="lt">${inl(c[2],q)}</span> <button class="cmb ${kGet(k).c?'has':''}" data-kc="${k}" title="対処のコメント">💬</button>${cmtHtml(k)}</div></li>`}
      else h+='<li>'+inl(t,q)+'</li>';
      continue;
    }
    closeUl();
    if(l.trim())h+='<p>'+inl(l,q)+'</p>';
    i++;
  }
  closeUl();return {h,secs,keys};
}

function preSplit(src){

function kdChips(){const t=[['kakunin','確認事項（行動別）'],['shinchoku','進捗（プロジェクト別）・参照のみ']];
  return '<div class="chips">'+t.map(([k,l])=>`<span class="chip" data-kd="${k}" style="${k===S.kd?'background:var(--acc);color:#fff':''}">${l}</span>`).join('')+'</div>'}
function bindKdChips(m){m.querySelectorAll('[data-kd]').forEach(c=>c.onclick=()=>{if(S.kd===c.dataset.kd)return;S.kd=c.dataset.kd;S.kq='';rKK(m);window.scrollTo(0,0)})}
function rKK(m){(S.kd==='shinchoku'?rKK2:rKK1)(m)}
function mdView(src,q){
  const L=src.replace(/\r\n?/g,'\n').split('\n');let h='',i=0,inUl=false,secs=[];
  const closeUl=()=>{if(inUl){h+='</ul>';inUl=false}};
  const hit=t=>!q||t.toLowerCase().includes(q.toLowerCase());
  while(i<L.length){
    let l=L[i];
    if(/^\s*\|/.test(l)){
      closeUl();const rows=[];while(i<L.length&&/^\s*\|/.test(L[i])){rows.push(L[i]);i++}
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head=cells(rows[0]);const body=rows.slice(1).filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r)).map(cells);
      const shown=body.filter(r=>hit(r.join(' ')));if(!shown.length)continue;
      h+='<div class="tw"><table><tr>'+head.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr>';
      for(const r of shown)h+='<tr>'+r.map((c,ci)=>`<td data-l="${esc(head[ci]||'')}">`+inl(c,q)+'</td>').join('')+'</tr>';
      h+='</table></div>';continue;
    }
    let mm;
    if(/^\s*-{3,}\s*$/.test(l)){closeUl();h+='<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">';i++;continue}
    if((mm=l.match(/^(#{1,4})\s+(.*)/))){closeUl();const lv=Math.min(mm[1].length,3);if(lv===2)secs.push(mm[2]);
      h+=`<h${lv} ${lv===2?`id="p${secs.length}"`:''}>${inl(mm[2])}</h${lv}>`;i++;continue}
    if((mm=l.match(/^\s*[-*]\s+(.*)/))){const t=mm[1];i++;if(!hit(t))continue;if(!inUl){h+='<ul>';inUl=true}h+='<li>'+inl(t,q)+'</li>';continue}
    closeUl();if(l.trim()&&hit(l))h+='<p>'+inl(l,q)+'</p>';i++;
  }
  closeUl();return {h,secs};
}

/* 個人情報らしい記載・抜けの点検 */
function pCheck(){
  const s=pScene();const miss=[],priv=[],tips=[];
  if(!PD.env)miss.push('入力している環境');
  const {own,com}=pFields(s);
  for(const fd of own)if(fd.req&&pEmpty(pF(s)[fd.k]))miss.push(fd.l);
  const txt=[...own.filter(f=>f.priv).map(f=>pF(s)[f.k]),...com.filter(f=>f.priv).map(f=>pC()[f.k])].filter(Boolean).join('\n');
  const R=[[/(氏名|生年月日|患者ID|カルテ番号|住所|電話番号)/,'「氏名・生年月日・ID・住所」などの語'],[/(19|20)\d{2}\s*[\/年.\-]\s*\d{1,2}\s*[\/月.\-]\s*\d{1,2}/,'実際の日付（Day表記に）'],[/(昭和|平成|令和)\s*\d+\s*年/,'和暦の日付'],[/(^|[^\d.])\d{7,}(?!\d)/,'7桁以上の番号（ID？）']];
  for(const [re,l] of R)if(re.test(txt))priv.push('・'+l);
  const nm=(txt.match(/[一-龥ぁ-んァ-ヶ]{1,5}(様|さん|殿|先生)/g)||[]).filter(x=>!/(同様|多様|模様|仕様|異様|態様|一様|各様|皆様|皆さん|患者さん|患者様|家族様|ご家族|奥様|お子さん|主治医の先生|前医の先生)$/.test(x));
  if(nm.length)priv.push('・人名らしい記載：'+[...new Set(nm)].slice(0,3).join('、'));
  const main=own.find(f=>f.main);const mv=main&&pF(s)[main.k];
  if(mv&&mv.trim().length<15)tips.push('本文が短めです。何を決めたい・作りたいのかを1文で');
  if(s.id==='clin'){const f=pF(s);if(pEmpty(f.pt)&&!(f.kata||'').startsWith('04'))tips.push('患者背景がないと一般論の答えになります（匿名化して判断に効く条件だけでも）');
    if(pEmpty(pC().purpose))tips.push('目的（カンファ用・説明用・自分の判断用など）があると深さが合います')}
  if(pEmpty(pC().out))tips.push('成果物の形が未選択（Claudeにおまかせになります）');
  if((pC().how||[]).includes('Web不要')&&(pC().how||[]).includes('Webで最新確認'))tips.push('進め方の「Web不要」と「Webで最新確認」が両方選ばれています');
  if(P_BOOKS[PD.env]===undefined&&PD.env&&(pC().fold||[]).length)tips.push('この環境ではPCのフォルダは使えません');
  return {miss,priv,tips};
}
function pUpd(){

    (ck.tips.length?`<div class="pw">${ck.tips.map(t=>'・'+esc(t)).join('<br>')}</div>`:'')+
    (!ck.miss.length&&!ck.priv.length&&!ck.tips.length?'<div class="pw ok">✓ 抜けはありません</div>':'');

function pBuild(){
  const s=pScene();if(!s)return '';
  const {own,com}=pFields(s);const f=pF(s),c=pC();
  const sec={body:[],pre:[],out:[],ref:[],how:[]};
  const put=(fd,v)=>{
    if(pEmpty(v))return;
    let t=Array.isArray(v)?v.join('、'):String(v).trim();if(!t)return;
    if(fd.k==='len'){t=(P_LEN.find(x=>x[0]===t)||[])[1];if(!t)return;sec.out.push('- 長さ：'+t);return}
    if(fd.k==='unk'){t=(P_UNK.find(x=>x[0]===t)||[])[1];if(t)sec.how.push('- '+t);return}
    if(fd.k==='how'){for(const x of v){const y=P_HOW.find(z=>z[0]===x);if(y)sec.how.push('- '+y[1])}return}
    if(fd.k==='kata'){if(t==='おまかせ')sec.how.push('- 検討の型は内容から判断する（claude_tools\\_prompts\\ の01〜04）');
      else if(t.startsWith('なし'))sec.how.push('- 検討の型：なし（CLAUDE.mdの規則だけで）');
      else{const fn={'01':'01_薬剤・治療法','02':'02_手術症例','03':'03_術中技術・トラブルシューティング','04':'04_稀少症例の文献検索・既報一覧'}[t.slice(0,2)];
        sec.how.push('- 検討の型：claude_tools\\_prompts\\'+fn+'.md を読んでから作業する'+(t.startsWith('03')?'（レポートにせず、短く速く）':''))}return}
    if(fd.k==='fold'){for(const x of v){const k=(P_FOLD.find(z=>z[1]===x)||[])[0];
      if(k==='books'){if(P_BOOKS[PD.env])sec.ref.push('- 追加で見るフォルダ：'+P_BOOKS[PD.env])}else sec.ref.push('- 追加で見るフォルダ：'+x)}return}
    if(fd.k==='bunya'){sec.ref.push('- 分野：'+t+'（蔵書の分野フォルダ）');return}
    if(fd.k==='prev'){sec.ref.push('- 以前のチャット・質問：'+t+'（過去のチャットを検索して参照する）');return}
    if(fd.k==='proj'){sec.ref.push('- 関連するプロジェクト：'+t+'（D:\\7.claude_projects\\ の該当フォルダの00_README.mdから）');return}

    if(fd.t==='ta'||t.includes('\n'))sec[fd.sec].push('**'+fd.l+'**\n'+t);
    else sec[fd.sec].push('- '+fd.l+'：'+t);
  };
  for(const fd of own)put(fd,f[fd.k]);
  for(const fd of com)put(fd,c[fd.k]);
  if(s.id==='case')sec.how.unshift('- スキル case-report-workflow の工程で進める');
  if(s.id==='file'&&f.proc&&!f.proc.startsWith('なし'))sec.how.unshift('- claude_tools\\CLAUDE.md の「書籍PDFの作業」にある既定の手順に従う');
  const envL=(P_ENV.find(e=>e[0]===PD.env)||[])[1];
  if(envL){if(P_BOOKS[PD.env])sec.ref.unshift(`- 入力している環境：${envL}（蔵書は ${P_BOOKS[PD.env]}、プロジェクトは D:\\7.claude_projects\\。接続されていれば使う）`);
    else sec.ref.unshift(`- 入力している環境：${envL}（PCのフォルダには接続していない。プロジェクトのナレッジとWeb検索で対応し、成果物はチャットかArtifactで）`)}
  const H={body:'依頼の本文',pre:'前提・条件',out:'求める成果物',ref:'参照先・関連',how:'進め方'};
  let r=`# 依頼：${s.name}\n`;
  for(const k of ['body','pre','out','ref','how'])if(sec[k].length)r+=`\n## ${H[k]}\n`+sec[k].join('\n')+'\n';

}

/* ---- Googleカレンダー取り込み（.ics／エクスポートzip） ---- */
async function unzip(buf){
  const dv=new DataView(buf);let e=buf.byteLength-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('zipが読めません');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out=[];
  for(let i=0;i<n;i++){
    const method=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(new Uint8Array(buf,p+46,nl));p+=46+nl+xl+cl;
    if(!/\.ics$/i.test(name))continue;
    const lnl=dv.getUint16(lo+26,true),lxl=dv.getUint16(lo+28,true);
    const data=new Uint8Array(buf,lo+30+lnl+lxl,cs);let bytes;
    if(method===0)bytes=data;
    else if(method===8){
      if(!window.DecompressionStream)throw new Error('このブラウザはzipを開けません。PCで解凍して中の.icsを選んでください');
      bytes=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    }else continue;
    out.push({name:name.split('/').pop(),text:new TextDecoder().decode(bytes)});
  }
  return out;
}
function icsUnesc(v){return v.replace(/\\n/gi,'\n').replace(/\\([,;\\])/g,'$1')}
function icsDT(v,params){
  v=(v||'').trim();
  if(/VALUE=DATE(?!-)/i.test(params||'')||/^\d{8}$/.test(v))return {date:v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8),allDay:true};
  const m=v.match(/^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)(Z?)$/);if(!m)return null;
  if(m[7]){const d=new Date(Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]));return {date:ymd(d),time:pad(d.getHours())+':'+pad(d.getMinutes()),allDay:false}}
  return {date:m[1]+'-'+m[2]+'-'+m[3],time:m[4]+':'+m[5],allDay:false};
}
function parseICS(text){
  const L=text.replace(/\r\n?/g,'\n').replace(/\n[ \t]/g,'').split('\n');
  let name='',cur=null,depth=0;const evs=[];
  for(const l of L){
    if(l==='BEGIN:VEVENT'){cur={ex:new Set()};depth=0;continue}
    if(l==='END:VEVENT'){if(cur)evs.push(cur);cur=null;continue}
    if(cur&&/^BEGIN:/.test(l)){depth++;continue}
    if(cur&&/^END:/.test(l)){depth--;continue}
    const m=l.match(/^([A-Za-z0-9-]+)((?:;[^:]*)?):(.*)$/);if(!m)continue;
    const k=m[1].toUpperCase(),pr=m[2],v=m[3];
    if(!cur){if(k==='X-WR-CALNAME')name=icsUnesc(v);continue}
    if(depth>0)continue; // VALARM など
    if(k==='UID')cur.uid=v;
    else if(k==='SUMMARY')cur.title=icsUnesc(v);
    else if(k==='DESCRIPTION')cur.desc=icsUnesc(v);
    else if(k==='LOCATION')cur.loc=icsUnesc(v);
    else if(k==='STATUS')cur.status=v.toUpperCase();
    else if(k==='DTSTART')cur.s=icsDT(v,pr);
    else if(k==='DTEND')cur.e=icsDT(v,pr);
    else if(k==='RRULE')cur.rr=Object.fromEntries(v.split(';').map(x=>x.split('=')));
    else if(k==='EXDATE')v.split(',').forEach(x=>{const d=icsDT(x,pr);if(d)cur.ex.add(d.date)});
    else if(k==='RECURRENCE-ID'){const d=icsDT(v,pr);if(d)cur.rid=d.date}
  }
  return {name,evs:evs.filter(e=>e.s&&e.status!=='CANCELLED'||e.rid)};
}
const DOWC=['SU','MO','TU','WE','TH','FR','SA'];
function expandICS(cal,from,to){
  const out=[];const over=new Map();
  for(const e of cal.evs)if(e.rid){if(!over.has(e.uid))over.set(e.uid,new Set());over.get(e.uid).add(e.rid)}
  const dayDiff=(a,b)=>Math.round((pYmd(b)-pYmd(a))/864e5);
  for(const e of cal.evs){
    if(!e.s)continue;
    if(e.rid&&e.status==='CANCELLED')continue;
    let endDate='',span=0;
    if(e.e){const ed=e.s.allDay?addDays(e.e.date,-1):e.e.date;const midnight=!e.s.allDay&&e.e.time==='00:00'&&ed===addDays(e.s.date,1);if(ed>e.s.date&&!midnight){endDate=ed;span=dayDiff(e.s.date,ed)}}
    const base={title:e.title||'（無題）',allDay:e.s.allDay,start:e.s.allDay?'':e.s.time,end:e.s.allDay||!e.e?'':e.e.time,
      note:[e.loc?'場所：'+e.loc:'',e.desc||''].filter(Boolean).join('\n').slice(0,2000),uid:e.uid||hkey(JSON.stringify(e.s)+e.title)};
    const push=d=>{const ed=span?addDays(d,span):'';if((ed||d)<from||d>to)return;out.push(Object.assign({},base,{date:d,endDate:ed}))};
    if(!e.rr||e.rid){push(e.s.date);continue}
    const r=e.rr,iv=+(r.INTERVAL||1),cnt=r.COUNT?+r.COUNT:Infinity;
    const until=r.UNTIL?(icsDT(r.UNTIL,'')||{}).date||'9999':'9999';
    const skip=new Set([...e.ex,...(over.get(e.uid)||[])]);
    let n=0,guard=0;const s0=pYmd(e.s.date);
    const emit=d=>{if(d<e.s.date)return true;if(d>until||n>=cnt||d>to)return false;n++;if(!skip.has(d))push(d);return true};
    const byday=(r.BYDAY||'').split(',').filter(Boolean);
    if(r.FREQ==='DAILY'){for(let d=e.s.date;guard++<20000;d=addDays(d,iv)){if(!emit(d))break}}
    else if(r.FREQ==='WEEKLY'){
      const wd=byday.length?byday.map(x=>DOWC.indexOf(x.slice(-2))).sort((a,b)=>a-b):[s0.getDay()];
      let wk=addDays(e.s.date,-s0.getDay());let go=true;
      while(go&&guard++<5000){for(const w of wd){if(!emit(addDays(wk,w))){go=false;break}}wk=addDays(wk,7*iv)}
    }else if(r.FREQ==='MONTHLY'||r.FREQ==='YEARLY'){
      const step=r.FREQ==='YEARLY'?12*iv:iv;
      for(let k=0;guard++<2000;k+=step){
        const y=s0.getFullYear(),mo=s0.getMonth()+k;const fm=new Date(y,mo,1);let d=null;
        if(byday.length&&r.FREQ==='MONTHLY'){
          const mm=byday[0].match(/^([+-]?\d+)?([A-Z]{2})$/)||[0,'1',DOWC[s0.getDay()]];const w=DOWC.indexOf(mm[2]);const nth=+(mm[1]||1);
          if(nth>0){const f=1+(w-fm.getDay()+7)%7;const dd=f+7*(nth-1);if(dd<=new Date(y,mo+1,0).getDate())d=ymd(new Date(y,mo,dd))}
          else{const ld=new Date(y,mo+1,0);const dd=ld.getDate()-((ld.getDay()-w+7)%7)+7*(nth+1);d=ymd(new Date(y,mo,dd))}
        }else{const dd=+(r.BYMONTHDAY||s0.getDate());if(dd<=new Date(y,mo+1,0).getDate())d=ymd(new Date(y,mo,dd))}
        if(!d){if(ymd(fm)>to)break;continue}
        if(!emit(d))break;
      }
    }else push(e.s.date);
  }
  return out;
}

    $('#iF').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;const buf=await f.arrayBuffer();const b=new Uint8Array(buf);
      if(b[0]===0x50&&b[1]===0x4b)load([{zip:true,buf}]);else load([{name:f.name,text:new TextDecoder().decode(b)}])};
    $('#iPB').onclick=()=>{const t=$('#iP').value;if(!/BEGIN:VEVENT/.test(t)){toast('BEGIN:VEVENT を含む内容を貼ってください');return}load([{name:'貼り付け',text:t}])};
    $('#md').querySelectorAll('[data-ci]').forEach(c=>c.onchange=()=>{cals[+c.dataset.ci].on=c.checked});
    $('#md').querySelectorAll('[data-cc]').forEach(c=>c.onchange=()=>{cals[+c.dataset.cc].cat=c.value});
    const go=$('#iGo');
    if(go)go.onclick=()=>{
      const A=$('#iA').value,B=$('#iB').value;S.iA=A;S.iB=B;
      if(!A||!B||A>B){toast('期間を確認してください');return}
      let add=0,upd=0;const t=now();
      for(const c of cals.filter(c=>c.on)){
        for(const x of expandICS(c,A,B)){
          const id='g'+hkey(x.uid+'|'+x.date)+hkey(x.date+'|'+x.uid).slice(1);
          const rec={id,title:x.title,date:x.date,endDate:x.endDate,allDay:x.allDay,start:x.start,end:x.end,cat:c.cat,note:x.note,src:'google',cal:c.name};
          const old=db.events.find(e=>e.id===id);
          if(old){Object.assign(old,rec,{deleted:false});touch(old);upd++}else{rec.createdAt=t;db.events.push(touch(rec));add++}
        }
      }
      closeModal();commit();toast(`取り込みました（新規${add}件・更新${upd}件）`);
    };
  };
  draw();
}

/* ---- モーダル ---- */
function modal(html){$('#md').innerHTML=html;$('#ov').classList.add('on');$('#md').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal)}
function closeModal(){$('#ov').classList.remove('on');$('#md').innerHTML='';render()}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ov').classList.contains('on'))closeModal()});

/* ---- 起動 ---- */
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){checkVer();if(configured()&&!$('#ov').classList.contains('on'))sync()}});
checkVer();
window.addEventListener('online',()=>{if(configured())sync()});
render();setStatus();
if(configured())sync();
</script>
