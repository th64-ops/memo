<!DOCTYPE html>
<html lang="ja">
<head>

<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#222;--sub:#6b6b6b;--line:#e2e0d9;--acc:#2f5d50;--acc2:#e6efeb;--red:#c0392b;--warn:#b7791f;--mark:#fff3b0}
@media (prefers-color-scheme:dark){:root{--bg:#161817;--card:#212423;--ink:#e8e8e6;--sub:#9a9d9b;--line:#363b39;--acc:#7fbfa8;--acc2:#25332e;--red:#e57368;--warn:#e0b25a;--mark:#5a4e10}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Meiryo","メイリオ","MS Gothic","ＭＳ ゴシック",sans-serif;font-size:15px;line-height:1.65}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:calc(6px + env(safe-area-inset-top)) 10px 6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
header h1{font-size:16px;margin:0 6px 0 0;cursor:pointer;white-space:nowrap}
.st{font-size:12px;color:var(--sub);margin-left:auto;white-space:nowrap}
.st.err{color:var(--red)}
main{max-width:960px;margin:0 auto;padding:10px 10px 60px}
.btn{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.s{font-size:12.5px;padding:3px 8px}
.btn.d{color:var(--red)}
.btn.on{background:var(--acc2);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],input[type=password],input[type=date],select,textarea{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card);color:var(--ink);max-width:100%}
textarea{width:100%;min-height:9em}
.search{width:100%;font-size:16px;padding:9px 12px}
h2{font-size:16px;margin:14px 0 8px}
h3.g{font-size:14px;margin:12px 0 6px;color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.fb{display:flex;justify-content:space-between;align-items:center;gap:4px;text-align:left;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 10px;cursor:pointer;min-height:44px}
.fb .n{font-size:12px;color:var(--sub);white-space:nowrap}
.fb .n b{color:var(--acc)}
.fb.z{opacity:.45}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.item{display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--line);padding:9px 2px}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0;cursor:pointer}

.item.read .t{font-weight:normal;color:var(--sub)}
.chk{width:22px;height:22px;margin-top:2px;flex:none;cursor:pointer}

mark{background:var(--mark);color:inherit}
.snip{font-size:13px;color:var(--sub);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.md{overflow-wrap:anywhere}

.md p{margin:6px 0}

.tw{overflow-x:auto;margin:6px 0}

.crumb a{color:var(--acc);cursor:pointer;text-decoration:underline}
a{color:var(--acc)}

.new{color:var(--acc);font-weight:bold}.ow{color:var(--warn);font-weight:bold}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
#toast.on{opacity:.95}
.fl{display:block;margin:8px 0 2px;font-size:13px;color:var(--sub)}
details.card>summary{cursor:pointer;font-weight:bold}
@media print{header,.noprint{display:none}body{background:#fff}.card{border:0}}
</style>

<body>
<header>
  <h1 id="home">📚 臨床疑問ノート</h1>
  <button class="btn s" data-go="#/">ホーム</button>
  <button class="btn s" data-go="#/imp">取り込み</button>
  <button class="btn s" data-go="#/set">設定</button>
  <button class="btn s" id="syncBtn" title="今すぐ同期">⟳</button>
  <span class="st" id="st"></span>
</header>
<main id="main"></main>
<div id="toast"></div>
<script>
'use strict';
const VER='v2026-11-12';
/* ===== 分野（D:\1,books\0.分野別統合 の番号に合わせる） ===== */
const GROUPS=[
 ['総論・GL・規約',['010_頻用','101_規約','110_GL','120_問題集','130_読本','300_外科総論']],
 ['消化管・臓器',['200_消化管','210_食道','220_胃','231_肝胆膵','232_肝','233_胆','234_膵','240_大腸','241_小腸','250_肛門','260_ヘルニア','270_乳腺','280_他臓器']],
 ['腫瘍・病理・化学療法・緩和',['400_腫瘍','401_病理','410_CTRX','420_緩和']],
 ['手術・解剖・手技',['501_手術','502_解剖','503_手技']],
 ['救急・ICU・周術期',['511_救急','512_急性腹症','513_ICU','520_周術期','530_栄養','540_麻酔']],
 ['内視鏡・画像・検査',['610_内視鏡','620_CT_MRI','630_LD','640_US','650_検査その他']],
 ['薬剤・内科・他科・感染症',['700_薬剤','810_内科','820_他科','830_感染症']],
 ['その他',['910_その他','021_同意書','031_paper','041_マニュアル']]
];
const FIELDS=GROUPS.flatMap(g=>g[1]);
const fName=f=>f.replace(/^\d+_/,'');
function normField(s){
  s=String(s||'').trim().replace(/\s+/g,'');if(!s)return null;
  if(FIELDS.includes(s))return s;
  const num=(s.match(/^(\d{3})/)||[])[1];
  if(num){const f=FIELDS.find(x=>x.startsWith(num+'_'));if(f)return f}
  const f2=FIELDS.find(x=>fName(x)===s||fName(x).toLowerCase()===s.toLowerCase());
  return f2||null;
}
const CONFS=['確実','おそらく','不確実'];

/* ===== 共通 ===== */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now();
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmtTs=t=>{const d=new Date(t);return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
function lsGet(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('端末への保存に失敗（容量不足の可能性）');return false}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2400)}
function hash(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(36)}
const normTitle=s=>String(s||'').replace(/\s+/g,'').toLowerCase();
const mkId=(created,title)=>'e'+hash((created||'')+'|'+normTitle(title));
function download(name,text,type){const b=new Blob([text],{type:type||'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('コピーしました')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('コピーしました')}catch(_){toast('コピーできませんでした')}ta.remove()}}

/* ===== データ ===== */
const LS={data:'cq.data',cfg:'cq.cfg',pending:'cq.pending'};
const DATA_PATH='rinsho/data.json';
const emptyDB=()=>({v:1,entries:[],marks:{}});
let db=Object.assign(emptyDB(),lsGet(LS.data)||{});
let pending=!!lsGet(LS.pending);
const live=()=>db.entries.filter(e=>!e.deleted);
const mark=id=>db.marks[id]||{};
function saveLocal(){lsSet(LS.data,db)}
function commit(){saveLocal();pending=true;lsSet(LS.pending,true);schedulePush()}
function setMark(id,k,v){const m=Object.assign({},mark(id));m[k]=v;m.at=now();db.marks[id]=m;commit()}

/* ===== GitHub 同期（メモ帖と同じリポジトリ memo-data を使う） ===== */
// 自分の設定が無ければ、同じ場所（github.io）で開いたメモ帖の設定（msb.cfg）を使う
function getCfg(){
  const own=lsGet(LS.cfg);
  if(own&&own.owner&&own.repo&&own.token)return Object.assign({src:'own'},own);
  const m=lsGet('msb.cfg');
  if(m&&m.owner&&m.repo&&m.token)return {owner:m.owner,repo:m.repo,token:m.token,src:'memo'};
  return {owner:'',repo:'',token:'',src:'none'};
}
let cfg=getCfg();
const configured=()=>cfg.owner&&cfg.repo&&cfg.token;
function b64enc(s){const b=new TextEncoder().encode(s);let bin='';for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin)}
function b64dec(s){const bin=atob(s.replace(/\s/g,''));const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder().decode(b)}
function api(path,{method='GET',body=null,raw=false}={}){
  const u='https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+path+(method==='GET'?'?t='+now():'');
  const h={'Authorization':'Bearer '+cfg.token,'Accept':raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if(body)h['Content-Type']='application/json';
  return fetch(u,{method,headers:h,cache:'no-store',body:body?JSON.stringify(body):undefined});
}
function apiErr(r){
  if(r.status===401)return 'トークンが無効か期限切れ（GitHubで作り直して設定に貼る）';
  if(r.status===403)return 'トークンに書き込み権限がない（Contents: Read and write）';
  if(r.status===404)return 'リポジトリが見つからない（名前・トークンの対象を確認）';
  return 'GitHubエラー '+r.status;
}
async function getFile(path){
  const r=await api(path);
  if(r.status===404){
    const r2=await fetch('https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo),{headers:{'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json'},cache:'no-store'});
    if(!r2.ok)throw new Error(apiErr(r2));
    return {text:null,sha:null};
  }
  if(!r.ok)throw new Error(apiErr(r));
  const j=await r.json();let text;
  if(j.content&&j.encoding==='base64')text=b64dec(j.content);
  else{const r3=await api(path,{raw:true});if(!r3.ok)throw new Error(apiErr(r3));text=await r3.text()}
  return {text,sha:j.sha};
}
function putFile(path,text,sha,msg){const body={message:msg,content:b64enc(text)};if(sha)body.sha=sha;return api(path,{method:'PUT',body})}
function mergeDB(a,b){
  const out=emptyDB();const m=new Map();
  for(const x of (b.entries||[]))m.set(x.id,x);
  for(const x of (a.entries||[])){const y=m.get(x.id);if(!y||(x.updatedAt||0)>=(y.updatedAt||0))m.set(x.id,x)}
  out.entries=[...m.values()].sort((p,q)=>(q.created||'').localeCompare(p.created||'')||(p.id<q.id?-1:1));
  const ks=new Set([...Object.keys(a.marks||{}),...Object.keys(b.marks||{})]);
  for(const k of ks){const x=(a.marks||{})[k],y=(b.marks||{})[k];out.marks[k]=(!y||(x&&(x.at||0)>=(y.at||0)))?x:y}
  return out;
}
function setStatus(s,msg){
  if(!configured()&&s!=='err')s='off';
  const el=$('#st');el.classList.toggle('err',s==='err');
  el.textContent=s==='sync'?'同期中…':s==='err'?('⚠ '+msg):s==='ok'?'✓ 同期済':s==='off'?'未設定（この端末だけ）':pending?'● 未送信':'';
  if(s==='err')el.title=msg;
}
let syncing=false;
async function sync(){
  if(!configured()){setStatus('off');return}
  if(syncing)return;syncing=true;setStatus('sync');
  try{
    for(let i=0;i<3;i++){
      const f=await getFile(DATA_PATH);
      const remote=f.text?JSON.parse(f.text):emptyDB();
      const merged=mergeDB(db,remote);
      const changed=JSON.stringify(merged)!==JSON.stringify(mergeDB(remote,emptyDB()));
      db=merged;saveLocal();
      if(!changed&&!(pending&&!f.sha)){pending=false;lsSet(LS.pending,false);break}
      const r=await putFile(DATA_PATH,JSON.stringify(merged,null,1),f.sha,'臨床疑問ノートを更新 '+fmtTs(now()));
      if(r.ok){pending=false;lsSet(LS.pending,false);break}
      if(r.status!==409&&r.status!==422)throw new Error(apiErr(r));
    }
    setStatus('ok');
  }catch(e){setStatus('err',e.message||'通信できません（オフライン？）')}
  finally{syncing=false;render()}
}
let pushT=null;
function schedulePush(){setStatus();clearTimeout(pushT);pushT=setTimeout(sync,1500)}

/* ===== 取り込み形式の読み取り =====
@@@CQ
題名: …
分野: 220_胃, 400_腫瘍
作成日: 2026-11-12
最終確認日: 2026-11-12
確信度: おそらく
タグ: …, …
元チャット: …
URL: https://claude.ai/chat/…
@@@本文
（Markdown）
@@@END
*/
const KEYS={'題名':'title','タイトル':'title','分野':'fields','作成日':'created','最終確認日':'checked','確信度':'conf','タグ':'tags','元チャット':'chat','チャット':'chat','URL':'url','url':'url','元URL':'url'};
function parseImport(txt){
  txt=String(txt||'').replace(/\r\n?/g,'\n').replace(/^\uFEFF/,'');
  const out=[];
  const re=/^@@@CQ[ \t]*$/m;
  if(!re.test(txt))return out;
  const parts=txt.split(/^@@@CQ[ \t]*$/m).slice(1);
  for(const p of parts){
    const bi=p.search(/^@@@本文[ \t]*$/m);
    const head=bi>=0?p.slice(0,bi):p;
    let body=bi>=0?p.slice(bi).replace(/^@@@本文[ \t]*\n?/,''):'';
    const ei=body.search(/^@@@END[ \t]*$/m);if(ei>=0)body=body.slice(0,ei);
    const e={title:'',fields:[],created:'',checked:'',conf:'',tags:[],chat:'',url:'',body:body.replace(/^\n+|\s+$/g,'')+'\n',bad:[]};
    for(const line of head.split('\n')){
      const m=line.match(/^\s*([^:：]+?)\s*[:：]\s*(.*)$/);if(!m)continue;
      const k=KEYS[m[1].trim()];if(!k)continue;const v=m[2].trim();
      if(k==='fields'){for(const s of v.split(/[,、，\/／]/)){if(!s.trim())continue;const f=normField(s);if(f){if(!e.fields.includes(f))e.fields.push(f)}else e.bad.push(s.trim())}}
      else if(k==='tags')e.tags=v.split(/[,、，]/).map(s=>s.trim().replace(/^#/,'')).filter(Boolean);
      else if(k==='created'||k==='checked')e[k]=normDate(v);
      else e[k]=v;
    }
    if(!e.title){const h=e.body.match(/^#{1,3}\s+(.+)$/m);e.title=h?h[1].trim():'（題名なし）'}
    if(!e.created)e.created=today();
    if(!e.checked)e.checked=e.created;
    out.push(e);
  }
  return out;
}
function normDate(v){const m=String(v).match(/(\d{4})[-\/年.](\d{1,2})[-\/月.](\d{1,2})/);return m?m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]):''}
function toImportText(e){
  return ['@@@CQ','題名: '+e.title,'分野: '+e.fields.join(', '),'作成日: '+(e.created||''),'最終確認日: '+(e.checked||''),'確信度: '+(e.conf||''),'タグ: '+(e.tags||[]).join(', '),'元チャット: '+(e.chat||''),'URL: '+(e.url||''),'@@@本文',(e.body||'').replace(/\s+$/,''),'@@@END',''].join('\n');
}
function upsert(p){
  const id=mkId(p.created,p.title);
  const old=db.entries.find(x=>x.id===id);
  const e={id,title:p.title,fields:p.fields.length?p.fields:['010_頻用'],created:p.created,checked:p.checked,conf:p.conf,tags:p.tags,chat:p.chat,url:p.url,body:p.body,hist:[],updatedAt:now()};
  if(old){
    e.hist=(old.hist||[]).slice(0,4);
    if(!old.deleted&&old.body!==p.body)e.hist.unshift({at:old.updatedAt,body:old.body,checked:old.checked});
    e.hist=e.hist.slice(0,5);
    if(old.body!==p.body){const m=Object.assign({},mark(id));m.read=false;m.at=now();db.marks[id]=m}
  }
  const i=db.entries.findIndex(x=>x.id===id);
  if(i>=0)db.entries[i]=e;else db.entries.push(e);
  return old&&!old.deleted?'ow':'new';
}

/* ===== Markdown 表示（外部ライブラリなし） ===== */
function inl(s){
  let t=esc(s);
  const codes=[];t=t.replace(/`([^`]+)`/g,(_,c)=>{codes.push(c);return '\u0000'+(codes.length-1)+'\u0000'});
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  t=t.replace(/(^|[^"=>])(https?:\/\/[^\s<）)」]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  t=t.replace(/==([^=]+)==/g,'<mark>$1</mark>');
  t=t.replace(/\u0000(\d+)\u0000/g,(_,i)=>'<code>'+codes[+i]+'</code>');
  return t;
}
function splitRow(l){l=l.trim().replace(/^\|/,'').replace(/\|$/,'');const c=[];let cur='',bt=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='`')bt=!bt;if(ch==='\\'&&l[i+1]==='|'){cur+='|';i++;continue}if(ch==='|'&&!bt){c.push(cur);cur=''}else cur+=ch}c.push(cur);return c.map(x=>x.trim())}
function md(src){
  const L=String(src||'').replace(/\r/g,'').split('\n');let h='',i=0,para=[];
  const flush=()=>{if(para.length){h+='<p>'+para.map(inl).join('<br>')+'</p>';para=[]}};
  while(i<L.length){
    const l=L[i];
    if(/^\s*```/.test(l)){flush();const buf=[];i++;while(i<L.length&&!/^\s*```/.test(L[i]))buf.push(L[i++]);i++;h+='<pre><code>'+esc(buf.join('\n'))+'</code></pre>';continue}
    if(/^\s*$/.test(l)){flush();i++;continue}
    let m;
    if((m=l.match(/^(#{1,6})\s+(.*)$/))){flush();const n=Math.min(m[1].length+1,4);h+='<h'+n+'>'+inl(m[2])+'</h'+n+'>';i++;continue}
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){flush();h+='<hr>';i++;continue}
    if(/^\s*\|/.test(l)&&i+1<L.length&&/^\s*\|?\s*:?-{2,}/.test(L[i+1])){
      flush();const hd=splitRow(l);i+=2;const rows=[];while(i<L.length&&/^\s*\|/.test(L[i]))rows.push(splitRow(L[i++]));
      h+='<div class="tw"><table><thead><tr>'+hd.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c).replace(/&lt;br\s*\/?&gt;/g,'<br>')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';continue}
    if(/^\s*>/.test(l)){flush();const buf=[];while(i<L.length&&/^\s*>/.test(L[i]))buf.push(L[i++].replace(/^\s*>\s?/,''));h+='<blockquote>'+md(buf.join('\n'))+'</blockquote>';continue}
    if(/^\s*([-*+]|\d+[.)])\s+/.test(l)){
      flush();
      const stack=[];
      while(i<L.length&&/^\s*([-*+]|\d+[.)])\s+/.test(L[i])){
        const mm=L[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);const ind=Math.floor(mm[1].replace(/\t/g,'  ').length/2);const tg=/\d/.test(mm[2])?'ol':'ul';
        while(stack.length>ind+1){h+='</li></'+stack.pop()+'>'}
        if(stack.length<ind+1){while(stack.length<ind+1){h+='<'+tg+'>';stack.push(tg)}h+='<li>'+inl(mm[3])}
        else h+='</li><li>'+inl(mm[3]);
        i++;
        while(i<L.length&&/^\s{2,}\S/.test(L[i])&&!/^\s*([-*+]|\d+[.)])\s+/.test(L[i])){h+='<br>'+inl(L[i].trim());i++}
      }
      while(stack.length)h+='</li></'+stack.pop()+'>';
      continue}
    para.push(l);i++;
  }
  flush();return h;
}

const hay=e=>(e.title+' '+(e.tags||[]).join(' ')+' '+e.fields.join(' ')+' '+(e.chat||'')+' '+e.body).toLowerCase();
function search(q,list){
  const ws=q.toLowerCase().split(/[\s　]+/).filter(Boolean);if(!ws.length)return list;
  return list.filter(e=>{const s=hay(e);return ws.every(w=>s.includes(w))});
}
function hl(text,q){
  let t=esc(text);const ws=String(q||'').split(/[\s　]+/).filter(Boolean).sort((a,b)=>b.length-a.length);
  for(const w of ws){const r=new RegExp(esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');t=t.replace(r,m=>'<mark>'+m+'</mark>')}
  return t;
}
function snippet(e,q){
  const plain=e.body.replace(/:?-{3,}:?/g,' ').replace(/[#*`>|=]/g,' ').replace(/\s+/g,' ').trim();
  const ws=String(q||'').toLowerCase().split(/[\s　]+/).filter(Boolean);
  let p=0;if(ws.length){const k=plain.toLowerCase().indexOf(ws[0]);if(k>30)p=k-30}
  return (p?'…':'')+plain.slice(p,p+140);
}

  }
  if(r.a==='set'){
    $('#s_save').onclick=()=>{lsSet(LS.cfg,{owner:$('#s_o').value.trim(),repo:$('#s_r').value.trim()||'memo-data',token:$('#s_k').value.trim()});cfg=getCfg();sync();render()};
    $('#s_clr').onclick=()=>{localStorage.removeItem(LS.cfg);cfg=getCfg();render();sync()};
    $('#x_imp').onclick=()=>download('臨床疑問ノート_全件_'+today()+'.md',live().map(toImportText).join('\n'));
    $('#x_json').onclick=()=>download('臨床疑問ノート_'+today()+'.json',JSON.stringify(db,null,1),'application/json');
    $('#x_rest').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.entries))throw 0;db=mergeDB(j,db);commit();toast('戻しました（今のデータと合わせました）');render()}catch(e){toast('読めないファイルです')}};
  }
}
document.addEventListener('click',ev=>{
  const t=ev.target;
  const gEl=t.closest('[data-go]');if(gEl){ev.preventDefault();if(gEl.dataset.go==='#/'){ST.q=''}go(gEl.dataset.go);return}
  const o=t.closest('[data-open]');if(o&&!t.closest('[data-tag]')){go('#/e/'+o.dataset.open);return}
  const tg=t.closest('[data-tag]');if(tg){ev.stopPropagation();go('#/t/'+encodeURIComponent(tg.dataset.tag));return}
  const fl=t.closest('[data-flag]');if(fl){const id=fl.dataset.flag;setMark(id,'recheck',!mark(id).recheck);render.keep=true;render();return}
  const lf=t.closest('[data-lf]');if(lf){ST.lf=lf.dataset.lf;render.keep=true;render();return}
});
document.addEventListener('change',ev=>{
  const t=ev.target;if(t.dataset&&t.dataset.read){setMark(t.dataset.read,'read',t.checked);render.keep=true;render()}
});
$('#home').onclick=()=>{ST.q='';go('#/')};
$('#syncBtn').onclick=()=>sync();
window.addEventListener('hashchange',()=>{const r=route();if(r.a!=='e')ST.edit=null;if(r.a==='f'||r.a==='t')ST.lf='all';if(r.a==='l')ST.lf=r.b||'all';render();window.scrollTo(0,0)});
window.addEventListener('focus',()=>{if(configured()&&!syncing)sync()});
{const r=route();if(r.a==='l')ST.lf=r.b||'all'}
render();
if(configured())sync();else setStatus('off');
</script>
</body>
